name: Verify npm release access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm identity and package access without publishing
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo '::error::NPM_TOKEN is not configured.'
            exit 1
          fi
          if ! username=$(npm whoami --registry=https://registry.npmjs.org --silent 2>/dev/null); then
            echo '::error::NPM_TOKEN could not authenticate with the npm registry.'
            exit 1
          fi
          echo "npm authenticated as ${username}."
          if ! access_json=$(npm access list packages "$username" polychat-bridge --json --registry=https://registry.npmjs.org 2>/dev/null); then
            echo '::error::Could not read npm package access for polychat-bridge.'
            exit 1
          fi
          node -e '
            const access = JSON.parse(process.argv[1]);
            const permission = access["polychat-bridge"];
            if (permission !== "read-write") {
              console.error(`::error::npm account lacks read-write access to polychat-bridge (found: ${permission ?? "none"}).`);
              process.exit(1);
            }
            console.log("npm account has read-write access to polychat-bridge.");
          ' "$access_json"
